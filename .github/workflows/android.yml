name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Configure Cargo for Mobile
        run: |
          # Ensure crate-type has cdylib and staticlib required by Tauri 2 mobile
          if ! grep -q "crate-type" src-tauri/Cargo.toml; then
            sed -i '/\[lib\]/a crate-type = ["staticlib", "cdylib", "rlib"]' src-tauri/Cargo.toml
          fi

      - name: Initialize & Build Android APK
        run: |
          npx tauri android init
          npx tauri android build --apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agency-agents-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
